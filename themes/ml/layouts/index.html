{{ define "main" }}
<section class="section-about">
  <div class="container">
    <div class="about-grid">

      <!-- Left column: photo + links -->
      <div class="about-left">
        <div class="about-photo">
          <img src="/images/profile.jpg" alt="{{ .Site.Params.author }}">
        </div>
        <div class="about-left-links">
          <a href="/cv.pdf" class="left-btn" target="_blank">CV</a>
          <a href="mailto:{{ .Site.Params.email }}" class="left-btn">Email</a>
          <a href="{{ .Site.Params.scholar }}" class="left-btn" target="_blank">Google Scholar</a>
        </div>
      </div>

      <!-- Right column: name, about, news -->
      <div class="about-right">
        <div class="about-header">
          <h1>{{ .Site.Params.author }}</h1>
          <p class="about-role">{{ .Site.Params.description }}</p>
        </div>
        <div class="about-body">
          {{ .Content }}
        </div>
        <div class="about-news">
          <h2 class="news-heading">News</h2>
          <p class="section-placeholder">No news yet.</p>
        </div>
      </div>

    </div>
  </div>
</section>
{{ end }}
